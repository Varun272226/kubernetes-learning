apiVersion: v1
kind: Pod

metadata:
  name: shared-volume-demo

spec:
  containers:

  - name: writer
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        while true
        do
          date > /data/time.txt
          sleep 5
        done

    volumeMounts:
    - name: shared-storage
      mountPath: /data

  - name: reader
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        while true
        do
          cat /data/time.txt
          sleep 5
        done

    volumeMounts:
    - name: shared-storage
      mountPath: /data

  volumes:
  - name: shared-storage
    emptyDir: {}
